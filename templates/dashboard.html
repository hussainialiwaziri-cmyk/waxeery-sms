<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WAXEERY SMS Dashboard</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }
        header {
            background: #0f172a;
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        header h2 { margin: 0; }
        main { max-width: 1100px; margin: auto; padding: 20px; }
        .card {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px #0000000d;
        }
        .stats {
            background: #2563eb;
            color: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        .stats strong { display: block; font-size: 32px; margin-top: 8px; }
        input, select {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 15px;
            background: white;
        }
        button {
            padding: 11px 15px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            cursor: pointer;
            margin: 4px 4px 4px 0;
        }
        button:hover { opacity: .88; }
        .danger { background: #dc2626; }
        .student {
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 12px;
            margin-top: 12px;
            overflow-wrap: anywhere;
        }
        .message { color: #166534; }
        h3 { margin-top: 0; }
        label { display: block; margin-top: 12px; font-weight: bold; }
        @media (max-width: 600px) {
            main { padding: 12px; }
            .card { padding: 15px; }
        }
    </style>
</head>
<body>
<header>
    <h2>WAXEERY SMS</h2>
    <button class="danger" onclick="logout()">Logout</button>
</header>

<main>
    <div class="stats">
        Total Students
        <strong id="totalStudents">0</strong>
    </div>

    <section class="card">
        <h3>Add New Student</h3>
        <form id="studentForm">
            <input name="name" placeholder="Full Name" required>
            <input name="matric" placeholder="Matric Number" required>
            <input name="department" placeholder="Department" required>
            <input name="level" placeholder="Level (e.g. 100)" required>
            <input name="course" placeholder="Course (e.g. COS 101)">
            <button type="submit">Add Student</button>
        </form>
        <p id="studentMessage" class="message"></p>
    </section>

    <section class="card">
        <h3>Course Registration</h3>
        <form id="registrationForm">
            <label for="regStudent">Select Student</label>
            <select id="regStudent" name="student_id" required>
                <option value="">Choose a student</option>
            </select>
            <input name="course_code" placeholder="Course Code (e.g. COS 101)" required>
            <input name="course_title" placeholder="Course Title" required>
            <label for="semester">Semester</label>
            <select id="semester" name="semester" required>
                <option value="First Semester">First Semester</option>
                <option value="Second Semester">Second Semester</option>
            </select>
            <input name="session" value="2026/2027" placeholder="Academic Session" required>
            <button type="submit">Register Course</button>
        </form>
        <p id="registrationMessage" class="message"></p>
        <h3>Registered Courses</h3>
        <div id="registrations">Loading registrations...</div>
    </section>

    <section class="card">
        <h3>Manage Students</h3>
        <input id="search" placeholder="Search name, matric or course">
        <div id="students">Loading students...</div>
    </section>
</main>

<script>
    let allStudents = [];

    const studentsBox = document.getElementById("students");
    const totalStudents = document.getElementById("totalStudents");
    const regStudent = document.getElementById("regStudent");
    const registrationMessage = document.getElementById("registrationMessage");
    const registrationsBox = document.getElementById("registrations");

    async function loadStudents() {
        try {
            const response = await fetch("/api/students");
            const data = await response.json();

            if (!response.ok) throw new Error(data.error || "Could not load students");

            allStudents = Array.isArray(data) ? data : (data.students || []);
            totalStudents.textContent = allStudents.length;
            showStudents(allStudents);
            fillStudentOptions();
        } catch (error) {
            studentsBox.textContent = "Error loading students: " + error.message;
        }
    }

    function showStudents(students) {
        studentsBox.replaceChildren();

        if (!students.length) {
            studentsBox.textContent = "No students found.";
            return;
        }

        students.forEach(student => {
            const item = document.createElement("div");
            item.className = "student";

            const details = document.createElement("p");
            details.textContent =
                `${student.name} | ${student.matric} | ${student.department} | Level ${student.level} | Course: ${student.course || "N/A"}`;

            const edit = document.createElement("button");
            edit.textContent = "Edit";
            edit.onclick = () => editStudent(student);

            const remove = document.createElement("button");
            remove.textContent = "Delete";
            remove.className = "danger";
            remove.onclick = () => deleteStudent(student.id);

            item.append(details, edit, remove);
            studentsBox.appendChild(item);
        });
    }

    document.getElementById("search").addEventListener("input", event => {
        const term = event.target.value.toLowerCase();
        showStudents(allStudents.filter(student =>
            [student.name, student.matric, student.department, student.level, student.course]
                .some(value => String(value || "").toLowerCase().includes(term))
        ));
    });

    document.getElementById("studentForm").addEventListener("submit", async event => {
        event.preventDefault();
        const form = event.target;
        const body = Object.fromEntries(new FormData(form));

        try {
            const response = await fetch("/api/students", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify(body)
            });
            const result = await response.json();
            if (!response.ok) throw new Error(result.error || "Could not add student");

            document.getElementById("studentMessage").textContent =
                result.message || "Student added successfully.";
            form.reset();
            await loadStudents();
        } catch (error) {
            document.getElementById("studentMessage").textContent = error.message;
        }
    });

    async function editStudent(student) {
        const name = prompt("Full Name:", student.name);
        if (name === null) return;
        const matric = prompt("Matric Number:", student.matric);
        if (matric === null) return;
        const department = prompt("Department:", student.department);
        if (department === null) return;
        const level = prompt("Level:", student.level);
        if (level === null) return;
        const course = prompt("Course:", student.course || "");
        if (course === null) return;

        try {
            const response = await fetch(`/api/students/${student.id}`, {
                method: "PUT",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({name, matric, department, level, course})
            });
            const result = await response.json();
            if (!response.ok) throw new Error(result.error || "Could not update student");
            await loadStudents();
            alert(result.message || "Student updated.");
        } catch (error) {
            alert(error.message);
        }
    }

    async function deleteStudent(id) {
        if (!confirm("Are you sure you want to delete this student?")) return;

        try {
            const response = await fetch(`/api/students/${id}`, {method: "DELETE"});
            const result = await response.json();
            if (!response.ok) throw new Error(result.error || "Could not delete student");
            await loadStudents();
            await loadRegistrations();
            alert(result.message || "Student deleted.");
        } catch (error) {
            alert(error.message);
        }
    }

    function fillStudentOptions() {
        const previousValue = regStudent.value;
        regStudent.replaceChildren();

        const first = document.createElement("option");
        first.value = "";
        first.textContent = "Choose a student";
        regStudent.appendChild(first);

        allStudents.forEach(student => {
            const option = document.createElement("option");
            option.value = student.id;
            option.textContent = `${student.name} (${student.matric})`;
            regStudent.appendChild(option);
        });

        if (previousValue) regStudent.value = previousValue;
    }

    async function loadRegistrations() {
        try {
            const response = await fetch("/api/course-registrations");
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || "Could not load registrations");

            registrationsBox.replaceChildren();

            if (!Array.isArray(data) || !data.length) {
                registrationsBox.textContent = "No course registrations yet.";
                return;
            }

            data.forEach(reg => {
                const item = document.createElement("div");
                item.className = "student";

                const details = document.createElement("p");
                details.textContent =
                    `${reg.name} (${reg.matric}) | ${reg.course_code} - ${reg.course_title} | ${reg.semester} | ${reg.session}`;

                const remove = document.createElement("button");
                remove.textContent = "Remove Registration";
                remove.className = "danger";
                remove.onclick = async () => {
                    if (!confirm("Remove this course registration?")) return;

                    try {
                        const resultResponse = await fetch(
                            `/api/course-registrations/${reg.id}`,
                            {method: "DELETE"}
                        );
                        const result = await resultResponse.json();
                        if (!resultResponse.ok) throw new Error(result.error || "Could not remove registration");
                        registrationMessage.textContent = result.message || "Registration removed.";
                        await loadRegistrations();
                    } catch (error) {
                        registrationMessage.textContent = error.message;
                    }
                };

                item.append(details, remove);
                registrationsBox.appendChild(item);
            });
        } catch (error) {
            registrationsBox.textContent = "Error: " + error.message;
        }
    }

    document.getElementById("registrationForm").addEventListener("submit", async event => {
        event.preventDefault();
        const form = event.target;
        const body = Object.fromEntries(new FormData(form));
        body.student_id = Number(body.student_id);

        try {
            const response = await fetch("/api/course-registrations", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify(body)
            });
            const result = await response.json();
            if (!response.ok) throw new Error(result.error || "Registration failed");

            registrationMessage.textContent = result.message || "Course registered successfully.";
            form.reset();
            await loadRegistrations();
        } catch (error) {
            registrationMessage.textContent = error.message;
        }
    });

    async function logout() {
        try {
            await fetch("/api/logout", {method: "POST"});
        } finally {
            window.location.href = "/";
        }
    }

    loadStudents();
    loadRegistrations();
</script>
</body>
</html>
